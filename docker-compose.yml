# Local dev / experiment stack. See README "Docker quickstart".
#
# This is NOT how the official account trades - that is CT 108 + cron (README
# "Operations"). Everything here defaults to a TEST paper account via
# secrets.yaml,
# and run_cycle.py refuses --account official before the competition window
# regardless.
#
#   docker compose build
#   docker compose run --rm bot                       # dry-run cycle, gates skipped
#   docker compose run --rm bot -m unittest discover -s tests
#   docker compose run --rm bot status.py
#   docker compose run --rm bot flatten.py            # closes the TEST account's positions
#   docker compose run --rm bot override.py show
#
# ./logs (journal, halt files, overrides) and config.yaml are bind-mounted so
# state persists and config is editable without a rebuild.
name: alpaca-hackathon

services:
  bot:
    build: .
    image: alpaca-hackathon:latest
    environment:
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      # So `docker compose run --rm bot run_cycle.py --config config-variants/x.yaml`
      # works ad hoc, not only through the farm services.
      - ./config-variants:/app/config-variants:ro
      # Local dev credentials, read-only. `cp secrets.example.yaml secrets.yaml`
      # BEFORE the first run: compose creates an empty *directory* of that name
      # if the file is missing (harmless - the loader ignores it - but then
      # `rmdir secrets.yaml` and copy the example). Never baked into the image;
      # .dockerignore excludes it. The credential-free tests run without it.
      - ./secrets.yaml:/app/secrets.yaml:ro
    # Uncomment to hack on the code without rebuilding (tests, scripts, bot/):
    #  - ./bot:/app/bot:ro
    #  - ./tests:/app/tests:ro
    #  - ./run_cycle.py:/app/run_cycle.py:ro

  # --- Experiment farm (issue #13) -------------------------------------------
  # One long-running container per variant: its own config file, its own TEST
  # paper account (an accounts.<name> block in secrets.yaml), its own journal
  # (logs/journal-<name>.jsonl).
  # farm.py does what cron does on CT 108: a cycle every 10 min in market
  # hours, expiring-only flatten at 15:50 ET, eod_review at 16:05 ET.
  #   docker compose --profile farm up -d            # all variants
  #   docker compose --profile farm up bot-kimi26    # one, in the foreground
  #   docker compose run --rm bot farm.py --account kimi26 --config config-variants/kimi26.yaml --once
  # Add a variant: copy this block, a config-variants/<name>.yaml, and an
  # accounts.<name> block in secrets.yaml.
  bot-kimi26:
    image: alpaca-hackathon:latest
    build: .
    environment:
      TZ: ${TZ:-America/Chicago}
    command: ["farm.py", "--account", "kimi26", "--config", "config-variants/kimi26.yaml"]
    volumes:
      - ./logs:/app/logs
      - ./config-variants:/app/config-variants:ro
      - ./secrets.yaml:/app/secrets.yaml:ro
    restart: unless-stopped
    profiles: ["farm"]

  # Docs site (Docusaurus) rendering ./docs - the onboarding + reference
  # site. `docker compose up docs` then open http://localhost:3000. The
  # markdown is bind-mounted, so edits hot-reload; no Node on the host.
  docs:
    build: ./docs-site
    image: alpaca-hackathon-docs:latest
    ports:
      - "3000:3000"
    volumes:
      - ./docs:/docs:ro
      - ./docs-site/docusaurus.config.js:/site/docusaurus.config.js:ro
      - ./docs-site/sidebars.js:/site/sidebars.js:ro
      - ./docs-site/src:/site/src:ro
    profiles: ["docs"]
