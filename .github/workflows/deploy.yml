name: Deploy

# Redeploys CT 108 (alpaca-hackathon, on the home LAN) on every push to main.
# Runs on a self-hosted runner living ON CT 108 itself (systemd service under
# the ghdeploy user) — the runner connects outbound to GitHub to pick up
# jobs, so no inbound network path, VPN, or SSH hop is needed at all.
# "Deploying" is syncing the checkout the runner already has into
# /opt/alpaca-hackathon, the stable path future cron/venv provisioning will
# use (see homenetwork/ansible/roles/alpaca-hackathon).
#
# Security note: self-hosted runners on public repos are only safe when
# nothing untrusted can trigger them. This workflow deliberately triggers
# only on `push` to `main` (never pull_request/pull_request_target), so only
# someone with write access to this repo can run code on the runner.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, alpaca-hackathon]
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the checkout before syncing
        # The network this runner sits on has intermittently flaky DNS
        # (documented elsewhere) - seen once to leave $GITHUB_WORKSPACE
        # incomplete without actually failing the checkout step outright,
        # which then let `rsync --delete` propagate the incomplete tree
        # onto a previously-good deployment. Refuse to sync rather than
        # risk repeating that.
        run: |
          count=$(find "$GITHUB_WORKSPACE" -name '*.py' | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "::error::Checkout looks incomplete ($count .py files found) — refusing to sync"
            exit 1
          fi

      - name: Sync to /opt/alpaca-hackathon
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='logs' \
            --exclude='__pycache__' \
            "$GITHUB_WORKSPACE"/ /opt/alpaca-hackathon/

      - name: Restart the MQTT bridge onto the new code
        # cron entrypoints re-read the source every run, so a sync is enough
        # for them. The bridge is the exception: it is long-running, so
        # without a restart it keeps serving the OLD code indefinitely -
        # which once silently invalidated a live test, where a manual
        # restart landed one second before this rsync.
        #
        # The runner is unprivileged, so homenetwork's alpaca-hackathon role
        # grants it exactly one sudo rule - `systemctl restart` on this one
        # unit, nothing else (roles/alpaca-hackathon, tag runner-sudoers).
        # If that rule is absent the restart is skipped, not failed:
        # mqtt_bridge.py also watches its own source and exits for systemd
        # to bring it back, so the bridge still converges within ~25s. Never
        # fails the deploy either way - the sync succeeded and the whole
        # trading path is already current.
        run: |
          unit=alpaca-hackathon-mqtt-bridge
          if ! systemctl is-active --quiet "$unit" 2>/dev/null; then
            echo "::notice::$unit is not running here - nothing to reload"
            exit 0
          fi
          if sudo -n /usr/bin/systemctl restart "$unit" 2>/dev/null; then
            sleep 3
            systemctl is-active --quiet "$unit" \
              && echo "restarted $unit onto $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)" \
              || echo "::warning::$unit did not come back after restart - check journalctl -u $unit"
            exit 0
          fi
          echo "::warning::no sudo rule to restart $unit (apply homenetwork roles/alpaca-hackathon --tags runner-sudoers). Falling back to its own source watcher, which restarts it within ~25s."
