# Copy to secrets.yaml (gitignored) and fill in:
#
#     cp secrets.example.yaml secrets.yaml
#
# This is the only place local dev credentials belong. One file, every local
# account - it replaces the old .env / .env.<name> pair, where nothing on the
# file said which account the keys inside it were for.
#
# WHERE THESE VALUES COME FROM
#
#   Maintainer - the private homenetwork repo's ansible vault. Copy by hand:
#
#       cd ~/homenetwork/ansible && ansible-vault view vault.yml
#
#       accounts.test.api_key     <-  vault_alpaca_hackathon_test_api_key
#       accounts.test.secret_key  <-  vault_alpaca_hackathon_test_secret_key
#       featherless_api_key       <-  vault_alpaca_hackathon_featherless_api_key
#
#   Teammates - you do NOT need the vault. Create your own Alpaca paper
#   account (alpaca.markets -> paper -> generate keys) and use those here,
#   with your own or the shared Featherless key.
#
# NOT THESE. In that same vault, the bare vault_alpaca_api_key /
# vault_alpaca_secret_key (no `hackathon_`) - and the `pass alpaca/Key`
# password-store entry, which is verified to hold the identical value -
# belong to a DIFFERENT project: CT 107's alpaca-trader. They authenticate
# perfectly well and quietly trade the wrong account.
#
# THE OFFICIAL ACCOUNT IS NOT HERE, AND CANNOT BE. The judging account
# (PA3VS39Y5LE2) resolves only from /root/.config/alpaca-hackathon/
# credentials.env on CT 108. bot/credentials.py never consults this file for
# --account official, and rejects the whole file if an `official` entry
# appears in it - see "Official-account safety" in README.md.

# Shared by every account below; an account block may override either.
featherless_api_key: ""
base_url: https://paper-api.alpaca.markets

accounts:
  # The default for every entrypoint (--account test).
  test:
    api_key: ""
    secret_key: ""

  # Experiment-farm variant (docker compose --profile farm up bot-kimi26).
  # Its OWN paper account, so a challenger's fills never mix with test's.
  # One block per variant; the name must match both the --account argument
  # and config-variants/<name>.yaml. Delete this if you don't run the farm.
  # kimi26:
  #   api_key: ""
  #   secret_key: ""

# Optional MQTT side channel to Home Assistant (bot/mqtt.py). Leave this
# commented out locally unless you specifically want it: a local run with a
# broker configured creates an "AI Day Trader (test)" device and retained
# topics on the shared broker. CT 108 gets these from its deployed
# credentials file, never from here. Don't commit a LAN hostname or IP.
# mqtt:
#   host: ""
#   port: 1883
#   username: ""
#   password: ""
