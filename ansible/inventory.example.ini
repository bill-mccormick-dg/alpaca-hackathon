# Copy to inventory.ini (git-ignored) and fill in your Home Assistant host.
# This talks to the HOST that has HA's config directory on it - not to HA's
# API - so it works whether HA runs in Docker, as HAOS, or a bare venv.

[home_assistant]
ha.example.lan ansible_user=YOUR_SSH_USER

# Common overrides (defaults live in roles/ha-dashboard/defaults/main.yml):
[home_assistant:vars]
# ha_config_dir=/opt/homeassistant/config      # host path to HA's config/ dir
# ha_restart_method=docker                     # none | docker | systemd | command
# ha_docker_container_name=homeassistant
# ha_alert_light_entity=light.office_desk       # optional; skip for notification-only
