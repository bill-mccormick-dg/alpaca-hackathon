---
- name: Ensure the dashboard's parent directory exists
  ansible.builtin.file:
    path: "{{ ha_dashboard_dest | dirname }}"
    state: directory
    mode: "0755"

- name: Deploy the AI Day Trader dashboard (standalone YAML-mode file)
  ansible.builtin.template:
    src: dashboard.yaml.j2
    dest: "{{ ha_dashboard_dest }}"
    mode: "0644"
  register: alpaca_hackathon_dashboard_file
  notify: restart home assistant

- name: Deploy the read-only team dashboard (issue #87)
  ansible.builtin.template:
    src: dashboard_team.yaml.j2
    dest: "{{ ha_team_dashboard_dest }}"
    mode: "0644"
  register: alpaca_hackathon_team_dashboard_file
  notify: restart home assistant
  when: ha_team_dashboard_enabled

- name: Remove the team dashboard when disabled
  ansible.builtin.file:
    path: "{{ ha_team_dashboard_dest }}"
    state: absent
  notify: restart home assistant
  when: not ha_team_dashboard_enabled

- name: Show the one-time manual step to register the team dashboard
  ansible.builtin.debug:
    msg: >-
      Team dashboard written to {{ ha_team_dashboard_dest }}. Register it
      alongside the operational one, and mark the OPERATIONAL one admin-only
      so non-admin teammates cannot reach the kill switches:
        lovelace:
          dashboards:
            {{ ha_dashboard_url_path }}:
              require_admin: true          # <-- kill switches live here
              mode: yaml
              filename: {{ ha_dashboard_filename }}
            {{ ha_team_dashboard_url_path }}:
              mode: yaml
              title: {{ ha_team_dashboard_title }}
              icon: {{ ha_team_dashboard_icon }}
              show_in_sidebar: true
              filename: {{ ha_team_dashboard_filename }}
      Then create a NON-ADMIN Home Assistant user per teammate. See
      ansible/README.md "Remote team access" for the Tailscale side.
  when: ha_team_dashboard_enabled and alpaca_hackathon_team_dashboard_file.changed

- name: Show the one-time manual step to register the dashboard
  ansible.builtin.debug:
    msg: >-
      Dashboard file written to {{ ha_dashboard_dest }}. If configuration.yaml
      does not already reference it, add this under its `lovelace:` key (create
      the key if you don't have one - this role will not edit configuration.yaml
      itself, since a second top-level `lovelace:` key can silently clobber an
      existing one):
        lovelace:
          mode: storage
          dashboards:
            {{ ha_dashboard_url_path }}:
              mode: yaml
              title: {{ ha_dashboard_title }}
              icon: {{ ha_dashboard_icon }}
              show_in_sidebar: true
              filename: {{ ha_dashboard_filename }}
      Then reload (ha_restart_method, or Developer Tools > YAML > Restart).
  when: alpaca_hackathon_dashboard_file.changed

- name: Check whether automations.yaml already exists
  ansible.builtin.stat:
    path: "{{ ha_automations_file }}"
  register: alpaca_hackathon_automations_stat
  when: ha_register_automations

- name: Normalize a fresh-install automations.yaml (HA's own default content
    is a bare "[]" flow-style empty list, which is NOT valid to append a
    block-style sequence after - it terminates the YAML document. Strip a
    leading "[]" so our block becomes the document instead of following
    one. Only matches at the very start of the file; any real content
    already in the file is left untouched. Skipped when the file doesn't
    exist yet - blockinfile below creates it fresh in that case.
  ansible.builtin.replace:
    path: "{{ ha_automations_file }}"
    regexp: '^\[\][ \t]*\r?\n?'
    replace: ""
  when: ha_register_automations and alpaca_hackathon_automations_stat.stat.exists

- name: Register the alert automations (idempotent, marked block)
  ansible.builtin.blockinfile:
    path: "{{ ha_automations_file }}"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (alpaca-hackathon ha-dashboard)"
    block: "{{ lookup('template', 'automations_block.yaml.j2') }}"
  register: alpaca_hackathon_automations_file
  notify: restart home assistant
  when: ha_register_automations

- name: Remove the alert automations when disabled
  ansible.builtin.blockinfile:
    path: "{{ ha_automations_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (alpaca-hackathon ha-dashboard)"
    state: absent
  notify: restart home assistant
  when: not ha_register_automations
  failed_when: false
