---
# All generic defaults - nothing here assumes a particular network, host
# path, or supervisor style. Override via inventory/group_vars/-e for your
# own Home Assistant instance. See ansible/README.md.

# Where HA's config directory lives on the target host. "/config" is the
# path *inside* the official HA container/OS image; if you run HA some
# other way (bare venv, a docker-compose stack with a different bind mount),
# point this at that host path instead.
ha_config_dir: /config

# Which accounts to build a dashboard section + entities for. Must match
# the --account names your bot runs under (config.yaml's mqtt block on
# each). Add farm/challenger variants here too.
ha_accounts:
  - id: official
    label: "Official"
  - id: test
    label: "Test / challenger"
  - id: mixed
    label: "Mixed instruments"

# Must match config.yaml's mqtt.topic_prefix (bot/mqtt.py). HA's MQTT
# integration default discovery prefix is "homeassistant" - only change
# ha_discovery_prefix if you changed that in HA itself.
ha_mqtt_topic_prefix: alpaca-hackathon
ha_discovery_prefix: homeassistant

# The dashboard is deployed as a standalone YAML-mode Lovelace file. This
# role does NOT edit configuration.yaml's `lovelace:` key - on some setups
# that key already exists with its own dashboards, and blindly adding a
# second top-level `lovelace:` block (or fighting an existing one) can
# silently break the file. Instead the role prints the exact snippet to
# add by hand (idempotent either way - re-running just re-renders the file).
ha_dashboard_filename: dashboards/alpaca_hackathon.yaml
ha_dashboard_dest: "{{ ha_config_dir }}/{{ ha_dashboard_filename }}"
ha_dashboard_title: "AI Day Trader"
ha_dashboard_url_path: alpaca-hackathon
ha_dashboard_icon: mdi:chart-line

# A second, READ-ONLY dashboard for remote teammates (issue #87), reached
# over Tailscale. It renders the same state sensors plus the intra-day trade
# log and the end-of-day digest, and deliberately contains no switch/button
# entity: Home Assistant has no per-entity permissions for non-admin users,
# so anything on a dashboard they can open, they can operate. Mark the
# operational dashboard above admin-only when this is in use - see
# ansible/README.md "Remote team access".
ha_team_dashboard_enabled: true
ha_team_dashboard_filename: dashboards/alpaca_hackathon_team.yaml
ha_team_dashboard_dest: "{{ ha_config_dir }}/{{ ha_team_dashboard_filename }}"
ha_team_dashboard_title: "AI Day Trader — team view"
ha_team_dashboard_url_path: alpaca-hackathon-team
ha_team_dashboard_icon: mdi:account-eye

# Automations ARE safe to auto-register: automations.yaml is a flat list,
# so appending a marked, idempotent block never collides with existing
# content the way a second top-level key in configuration.yaml could.
ha_register_automations: true
ha_automations_file: "{{ ha_config_dir }}/automations.yaml"

# Optional: entity_id of a light to flash on trade/halt events. Leave
# blank to skip that action - the notification actions still fire either
# way, so the automations are useful with zero extra setup.
ha_alert_light_entity: ""

# --- Push notifications (issue #86) ------------------------------------------
# persistent_notification.create is IN-APP ONLY: it waits until someone opens
# Home Assistant. For a notification that reaches a phone you need a real
# notify service from the HA Companion app, e.g. notify.mobile_app_<device>.
# Blank leaves every automation as in-app only, so the role still works with
# no companion app configured.
ha_notify_service: ""

# Only PROBLEMS push, and only for the judged account. Fills, exits and
# rejections stay in-app: they are already covered by the dashboard and the
# hourly email, and a channel that fires on routine activity is a channel
# people mute - at which point the halt alert is lost too.
ha_push_account: official

# Stall detection: nothing has published for this long during market hours
# means no cycle is running - cron, the host, or the venv is broken and
# NOTHING is trading. A dashboard full of stale values looks identical to a
# quiet market, so this is the failure that is otherwise invisible. Derived
# from the equity sensor's last_updated, so it needs no extra publisher.
ha_stall_minutes: 25
# Local wall-clock on the Home Assistant host (NOT Eastern). Defaults suit a
# Central-time instance watching a 08:30-15:00 CT session, starting after the
# first cycle has had a chance to land.
ha_market_open_local: "09:00:00"
ha_market_close_local: "15:05:00"

# How to make HA pick up the new config. "none" (default) does nothing -
# reload via the UI (Developer Tools > YAML > "Automations" /
# "All YAML configuration") or your own mechanism. Set to "docker" or
# "systemd" only if that's genuinely how your instance runs, or
# "command" with ha_restart_command for anything else.
ha_restart_method: none
ha_docker_container_name: homeassistant
ha_systemd_service: home-assistant
ha_restart_command: ""

# Prefix of the entity_ids Home Assistant creates for this project. HA's
# MQTT discovery derives entity_id from slugify(device name) + entity name
# and IGNORES object_id (verified live), so this must match what
# bot/mqtt.py's DEVICE_NAME_FMT slugifies to - "AI Day Trader (<account>)"
# -> "ai_day_trader_<account>". Change it only if you changed that.
ha_entity_prefix: ai_day_trader
