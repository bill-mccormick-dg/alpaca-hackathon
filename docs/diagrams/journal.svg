<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a6c0dc"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1b0"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b191ff"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa9e6"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0b429"/></marker></defs>
<style>
  /* Every class here is prefixed, because these diagrams are INLINED into the
     slide deck and an SVG's internal stylesheet is not scoped - it applies to
     the whole host document. Unprefixed `.sub` and `.t` silently restyled the
     deck's own subtitles in monospace, and only on the slides that happened to
     come after a diagram in document order. */
  .dg-t { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eaf3fd; }
  .dg-m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
  .dg-band { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a6c0dc; font-size: 15px; letter-spacing: .14em; font-weight: 700; }
  .dg-lbl { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a6c0dc; font-size: 15px; }
  .dg-sub { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #a6c0dc; font-size: 14px; }
  .dg-cap { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a6c0dc; font-size: 17px; }
</style>
<rect width="1280" height="620" rx="22" fill="#0b1d33" stroke="#31567a" stroke-opacity=".55"/>
<rect x="330" y="34" width="620" height="96" rx="12" fill="#17324c" stroke="#4fd1b0" stroke-width="2.5"/><text class="dg-t dg-m" x="640" y="72" font-size="22" text-anchor="middle" font-weight="700">journal.jsonl</text><text class="dg-sub" x="640" y="98" text-anchor="middle">one per account, append-only</text><text class="dg-lbl" x="640" y="120" text-anchor="middle" font-size="14">every decision, order, rejection, exit, tool call and config hash</text><rect x="50" y="200" width="250" height="330" rx="12" fill="#12283f" stroke="#4fd1b0"/><text class="dg-band" x="175.0" y="230" fill="#4fd1b0" text-anchor="middle">THE BROWSER</text><text class="dg-t" x="175.0" y="266" font-size="21" text-anchor="middle" font-weight="700">Live journal viewer</text><text class="dg-sub" x="175.0" y="292" text-anchor="middle" fill="#4fd1b0">bot.wpmccormick.pw</text><text class="dg-lbl" x="66" y="328" font-size="14.5">- journal_viewer.py, :8300 on the LAN</text><text class="dg-lbl" x="66" y="362" font-size="14.5">- -&gt; cloudflared tunnel</text><text class="dg-lbl" x="66" y="396" font-size="14.5">- -&gt; Cloudflare Access (email OTP)</text><text class="dg-lbl" x="66" y="430" font-size="14.5">- server-sent events, live follow</text><text class="dg-lbl" x="66" y="464" font-size="14.5">- read-only: no controls at all</text><path d="M640,130 L640,168 L175.0,168 L175.0,193" stroke="#4fd1b0" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><rect x="360" y="200" width="250" height="330" rx="12" fill="#12283f" stroke="#5aa9e6"/><text class="dg-band" x="485.0" y="230" fill="#5aa9e6" text-anchor="middle">THE DASHBOARD</text><text class="dg-t" x="485.0" y="266" font-size="21" text-anchor="middle" font-weight="700">Home Assistant</text><text class="dg-sub" x="485.0" y="292" text-anchor="middle" fill="#5aa9e6">MQTT auto-discovery</text><text class="dg-lbl" x="376" y="328" font-size="14.5">- journal.log() -&gt; fire-and-forget</text><text class="dg-lbl" x="376" y="362" font-size="14.5">- equity, P&amp;L, halt, last decision</text><text class="dg-lbl" x="376" y="396" font-size="14.5">- kill switch + knobs, per-account</text><text class="dg-lbl" x="376" y="430" font-size="14.5">- sections layout: phone-friendly</text><text class="dg-lbl" x="376" y="464" font-size="14.5">- phone: problems only, never fills</text><path d="M640,130 L640,168 L485.0,168 L485.0,193" stroke="#5aa9e6" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><rect x="670" y="200" width="250" height="330" rx="12" fill="#12283f" stroke="#f0b429"/><text class="dg-band" x="795.0" y="230" fill="#f0b429" text-anchor="middle">THE INBOX</text><text class="dg-t" x="795.0" y="266" font-size="21" text-anchor="middle" font-weight="700">Hourly email</text><text class="dg-sub" x="795.0" y="292" text-anchor="middle" fill="#f0b429">mail_report.py</text><text class="dg-lbl" x="686" y="328" font-size="14.5">- trades with the model's full reason</text><text class="dg-lbl" x="686" y="362" font-size="14.5">- CSVs attached, host local time</text><text class="dg-lbl" x="686" y="396" font-size="14.5">- silent when nothing traded</text><text class="dg-lbl" x="686" y="430" font-size="14.5">- one final send after the close</text><path d="M640,130 L640,168 L795.0,168 L795.0,193" stroke="#f0b429" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><rect x="980" y="200" width="250" height="330" rx="12" fill="#12283f" stroke="#b191ff"/><text class="dg-band" x="1105.0" y="230" fill="#b191ff" text-anchor="middle">THE LOOP</text><text class="dg-t" x="1105.0" y="266" font-size="21" text-anchor="middle" font-weight="700">eod_review.py</text><text class="dg-sub" x="1105.0" y="292" text-anchor="middle" fill="#b191ff">the daily change</text><text class="dg-lbl" x="996" y="328" font-size="14.5">- round trips from Alpaca's fills</text><text class="dg-lbl" x="996" y="362" font-size="14.5">- rejections grouped by rule</text><text class="dg-lbl" x="996" y="396" font-size="14.5">- Brier score on the priors</text><text class="dg-lbl" x="996" y="430" font-size="14.5">- critique by a model that did not trade</text><path d="M640,130 L640,168 L1105.0,168 L1105.0,193" stroke="#b191ff" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><text class="dg-cap" x="640.0" y="590" text-anchor="middle">One file, four windows. Three are read-only views for humans; the fourth decides what changes tomorrow.</text></svg>