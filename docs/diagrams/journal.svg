<rect width="1280" height="620" fill="#0f1720"/>
<rect x="330" y="34" width="620" height="96" rx="12" fill="#1b2635" stroke="#4fb39c" stroke-width="2.5"/><text class="t m" x="640" y="72" font-size="22" text-anchor="middle" font-weight="700">journal.jsonl</text><text class="sub" x="640" y="98" text-anchor="middle">one per account, append-only</text><text class="lbl" x="640" y="120" text-anchor="middle" font-size="14">every decision, order, rejection, exit, tool call and config hash</text><rect x="50" y="200" width="250" height="330" rx="12" fill="#141d28" stroke="#4fb39c"/><text class="band" x="175.0" y="230" fill="#4fb39c" text-anchor="middle">THE BROWSER</text><text class="t" x="175.0" y="266" font-size="21" text-anchor="middle" font-weight="700">Live journal viewer</text><text class="sub" x="175.0" y="292" text-anchor="middle" fill="#4fb39c">bot.wpmccormick.pw</text><text class="lbl" x="66" y="328" font-size="14.5">- journal_viewer.py, :8300 on the LAN</text><text class="lbl" x="66" y="362" font-size="14.5">- -&gt; cloudflared tunnel</text><text class="lbl" x="66" y="396" font-size="14.5">- -&gt; Cloudflare Access (email OTP)</text><text class="lbl" x="66" y="430" font-size="14.5">- server-sent events, live follow</text><text class="lbl" x="66" y="464" font-size="14.5">- read-only: no controls at all</text><path d="M640,130 L640,168 L175.0,168 L175.0,193" stroke="#4fb39c" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><rect x="360" y="200" width="250" height="330" rx="12" fill="#141d28" stroke="#5aa9e6"/><text class="band" x="485.0" y="230" fill="#5aa9e6" text-anchor="middle">THE DASHBOARD</text><text class="t" x="485.0" y="266" font-size="21" text-anchor="middle" font-weight="700">Home Assistant</text><text class="sub" x="485.0" y="292" text-anchor="middle" fill="#5aa9e6">MQTT auto-discovery</text><text class="lbl" x="376" y="328" font-size="14.5">- journal.log() -&gt; fire-and-forget</text><text class="lbl" x="376" y="362" font-size="14.5">- equity, P&amp;L, halt, last decision</text><text class="lbl" x="376" y="396" font-size="14.5">- operator view: kill switch + knobs</text><text class="lbl" x="376" y="430" font-size="14.5">- team view over Tailscale: read-only</text><text class="lbl" x="376" y="464" font-size="14.5">- phone: problems only, never fills</text><path d="M640,130 L640,168 L485.0,168 L485.0,193" stroke="#5aa9e6" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><rect x="670" y="200" width="250" height="330" rx="12" fill="#141d28" stroke="#e3b341"/><text class="band" x="795.0" y="230" fill="#e3b341" text-anchor="middle">THE INBOX</text><text class="t" x="795.0" y="266" font-size="21" text-anchor="middle" font-weight="700">Hourly email</text><text class="sub" x="795.0" y="292" text-anchor="middle" fill="#e3b341">mail_report.py</text><text class="lbl" x="686" y="328" font-size="14.5">- trades with the model's full reason</text><text class="lbl" x="686" y="362" font-size="14.5">- CSVs attached, host local time</text><text class="lbl" x="686" y="396" font-size="14.5">- silent when nothing traded</text><text class="lbl" x="686" y="430" font-size="14.5">- one final send after the close</text><path d="M640,130 L640,168 L795.0,168 L795.0,193" stroke="#e3b341" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><rect x="980" y="200" width="250" height="330" rx="12" fill="#141d28" stroke="#a78bfa"/><text class="band" x="1105.0" y="230" fill="#a78bfa" text-anchor="middle">THE LOOP</text><text class="t" x="1105.0" y="266" font-size="21" text-anchor="middle" font-weight="700">eod_review.py</text><text class="sub" x="1105.0" y="292" text-anchor="middle" fill="#a78bfa">the daily change</text><text class="lbl" x="996" y="328" font-size="14.5">- round trips from Alpaca's fills</text><text class="lbl" x="996" y="362" font-size="14.5">- rejections grouped by rule</text><text class="lbl" x="996" y="396" font-size="14.5">- Brier score on the priors</text><text class="lbl" x="996" y="430" font-size="14.5">- critique by a model that did not trade</text><path d="M640,130 L640,168 L1105.0,168 L1105.0,193" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><text class="cap" x="640.0" y="590" text-anchor="middle">One file, four windows. Three are read-only views for humans; the fourth decides what changes tomorrow.</text></svg>