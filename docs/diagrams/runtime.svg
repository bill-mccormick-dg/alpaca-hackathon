idth="380" height="76" rx="10" fill="#231c35" stroke="#a78bfa" stroke-width="1.5"/><text class="t m" x="260.0" y="328.0" font-size="20" text-anchor="middle" font-weight="600">bot/decide.py</text><text class="sub" x="260.0" y="354.0" text-anchor="middle">prompt + 4 read-only tools</text><rect x="540" y="298" width="330" height="76" rx="10" fill="#231c35" stroke="#a78bfa" stroke-width="1.5"/><text class="t" x="705.0" y="328.0" font-size="20" text-anchor="middle" font-weight="600">JSON proposals</text><text class="sub" x="705.0" y="354.0" text-anchor="middle">or [] - hold</text><path d="M450,336 L533,336" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#am)" stroke-linejoin="round"/><rect x="985" y="298" width="240" height="76" rx="10" fill="#1b2635" stroke="#5aa9e6" stroke-width="1.5"/><text class="t" x="1105.0" y="328.0" font-size="20" text-anchor="middle" font-weight="600">Featherless.ai</text><text class="sub" x="1105.0" y="354.0" text-anchor="middle">open-weight model</text><path d="M934,320 L978,320" stroke="#5aa9e6" stroke-width="2" fill="none" marker-end="url(#ax)" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M978,352 L934,352" stroke="#5aa9e6" stroke-width="2" fill="none" marker-end="url(#ax)" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M1097.5,164 L1097.5,216 L200,216 L200,291" stroke="#4fb39c" stroke-width="2" fill="none" marker-end="url(#ag)" stroke-linejoin="round"/><text class="lbl" x="214" y="208" text-anchor="start">nothing due -&gt; ask the model</text><rect x="28" y="470" width="1224" height="150" rx="14" fill="#141d28" stroke="#4fb39c"/><text class="band" x="1234" y="496" fill="#4fb39c" text-anchor="end">DETERMINISTIC CODE - THE ONLY ORDER PATH</text><rect x="70" y="522" width="380" height="76" rx="10" fill="#1b2635" stroke="#4fb39c" stroke-width="1.5"/><text class="t m" x="260.0" y="552.0" font-size="20" text-anchor="middle" font-weight="600">place_proposal()</text><text class="sub" x="260.0" y="578.0" text-anchor="middle">every write goes through here</text><rect x="540" y="522" width="330" height="76" rx="10" fill="#1b2635" stroke="#e3b341" stroke-width="2.5"/><text class="t m" x="705.0" y="552.0" font-size="20" text-anchor="middle" font-weight="600">check_order()</text><text class="sub" x="705.0" y="578.0" text-anchor="middle">rejects, never clamps</text><rect x="960" y="522" width="265" height="76" rx="10" fill="#1b2635" stroke="#5aa9e6" stroke-width="1.5"/><text class="t" x="1092.5" y="552.0" font-size="20" text-anchor="middle" font-weight="600">Alpaca MCP</text><text class="sub" x="1092.5" y="578.0" text-anchor="middle">paper account only</text><path d="M450,560 L533,560" stroke="#4fb39c" stroke-width="2" fill="none" marker-end="url(#ag)" stroke-linejoin="round"/><path d="M870,560 L953,560" stroke="#4fb39c" stroke-width="2" fill="none" marker-end="url(#ag)" stroke-linejoin="round"/><text class="lbl" x="911" y="548" text-anchor="middle">approved</text><path d="M705,374 L705,424 L270,424 L270,515" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#am)" stroke-linejoin="round"/><path d="M1230,126.0 L1256,126.0 L1256,444 L350,444 L350,515" stroke="#4fb39c" stroke-width="2" fill="none" marker-end="url(#ag)" stroke-linejoin="round"/><text class="lbl" x="1244" y="436" text-anchor="end">code's own exit sells - same gate</text><rect x="400" y="672" width="480" height="62" rx="10" fill="#1b2635" stroke="#2b3a4a" stroke-width="1.5"/><text class="t m" x="640.0" y="695.0" font-size="20" text-anchor="middle" font-weight="600">journal.jsonl</text><text class="sub" x="640.0" y="721.0" text-anchor="middle">one record per event</text><path d="M705,598 L705,665" stroke="#e3b341" stroke-width="2" fill="none" marker-end="url(#ay)" stroke-linejoin="round"/><path d="M1092,598 L1092,703 L887,703" stroke="#93a4b5" stroke-width="2" fill="none" marker-end="url(#a)" stroke-linejoin="round"/><path d="M640,598 L640,640 L330,640 L330,703 L393,703" stroke="#d73a4a" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-linejoin="round"/><text class="lbl" x="324" y="632" text-anchor="end" fill="#d73a4a">rejected, with the rule that said no</text><text class="cap" x="640.0" y="758" text-anchor="middle">Everything outside the dashed box is deterministic code - there is no path from the model to an order.</text></svg>