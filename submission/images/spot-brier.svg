<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="A Brier score scale from zero to a quarter: the day's priors sit near zero, far from the coin-flip mark at 0.25">
<style>
  .sp-t { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eaf3fd; font-size: 19px; font-weight: 600; }
  .sp-d { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a6c0dc; font-size: 17px; }
  .sp-m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #a6c0dc; font-size: 16px; }
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd1b0"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient></defs><rect x="70" y="170" width="520" height="16" rx="8" fill="url(#g)" fill-opacity=".55"/><line x1="78" y1="144" x2="78" y2="170" stroke="#4fd1b0" stroke-width="3"/><circle cx="78" cy="178" r="9" fill="#4fd1b0" stroke="#0b1d33" stroke-width="3"/><text class="sp-t" x="88.32" y="138" text-anchor="start" style="fill:#4fd1b0">Kalshi 0.004</text><line x1="87" y1="212" x2="87" y2="186" stroke="#5aa9e6" stroke-width="3"/><circle cx="87" cy="178" r="9" fill="#5aa9e6" stroke="#0b1d33" stroke-width="3"/><text class="sp-t" x="96.64" y="232" text-anchor="start" style="fill:#5aa9e6">chain 0.008</text><line x1="590" y1="144" x2="590" y2="170" stroke="#ff6b6b" stroke-width="3"/><text class="sp-t" x="590" y="136" text-anchor="end" style="fill:#ff6b6b">0.25  a coin flip</text><text class="sp-m" x="56" y="186" text-anchor="end">0</text><text class="sp-d" x="70" y="46" text-anchor="start">Brier score - lower is better</text></svg>