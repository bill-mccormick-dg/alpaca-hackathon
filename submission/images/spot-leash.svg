<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A position's price path between a take-profit band above and a stop-loss band below, closed by code when it touches one">
<style>
  .sp-t { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eaf3fd; font-size: 19px; font-weight: 600; }
  .sp-d { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a6c0dc; font-size: 17px; }
  .sp-m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #a6c0dc; font-size: 16px; }
</style>
<rect x="70" y="86" width="530" height="26" fill="#4fd1b0" fill-opacity=".14"/><rect x="70" y="268" width="530" height="26" fill="#ff6b6b" fill-opacity=".14"/><line x1="70" y1="112" x2="600" y2="112" stroke="#4fd1b0" stroke-width="3" stroke-dasharray="10 7"/><text class="sp-m" x="76" y="102" text-anchor="start" style="fill:#4fd1b0">take-profit  +60%</text><line x1="70" y1="294" x2="600" y2="294" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="10 7"/><text class="sp-m" x="76" y="320" text-anchor="start" style="fill:#ff6b6b">stop-loss  -40%</text><line x1="70" y1="190" x2="600" y2="190" stroke="#31567a" stroke-dasharray="4 6"/><text class="sp-m" x="600" y="180" text-anchor="end">entry</text><path d="M80,190 L150,160 L230,200 L310,236 L390,220 L470,260 L520,294" fill="none" stroke="#b191ff" stroke-width="4" stroke-linejoin="round"/><circle cx="520" cy="294" r="11" fill="#ff6b6b" stroke="#0b1d33" stroke-width="3"/><text class="sp-t" x="600" y="330" text-anchor="end" style="fill:#ff6b6b">closed by code, not by the model</text></svg>