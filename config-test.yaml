# config-test.yaml - the CHALLENGER config for the test account (A/B, issue #34).
# Same guardrails as config.yaml; only the knobs below differ. Run with:
#   run_cycle.py --account test --config config-test.yaml
# Promote a winner by copying its values into config.yaml via a PR.

# config.yaml — risk/guardrail parameters for the hackathon bot.
#
# Every value here is a hard cap enforced in code (bot/risk.py) — the model
# proposes, this decides. Mirrors alpaca-trader's config.yaml philosophy:
# the LLM never gets to negotiate a limit, only stay inside one.

# Underlyings this bot is allowed to trade (stock or options on). Option
# proposals are checked against the underlying, not the OCC option symbol.
underlyings:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA

# Per-position notional cap, in dollars (stock market value, or option
# contracts * qty * 100 * price).
max_position_usd: 5000

# Max concurrent open positions (stock + option combined).
max_positions: 4

# Max option contracts in a single order — a backstop against a fat-fingered
# or hallucinated large size, independent of the dollar cap above.
max_contracts_per_order: 10

# Daily loss cutoff, % of start-of-day equity. Breaching this should flatten
# and halt for the day (flatten logic: a later step).
daily_loss_cutoff_pct: 2.0

# Options expiration window — entries (buys) for contracts outside this range
# are refused; sells are always legal down to expiry, so a position can be
# closed on its last day. Guards against 0-DTE gamma risk on one side,
# multi-month decay drag on the other.
#
# The floor must exceed eod_close_dte (#166): at 1 the funnel admitted 1-DTE
# entries the 14:50 CT backstop was guaranteed to sell the same afternoon -
# the spread paid twice for a thesis given no time. Day 2's 0-2 DTE-at-entry
# bucket lost $300 over 2 trades. Only the prompt argued against it, and a
# guardrail that depends on the model's goodwill is not one.
min_days_to_expiration: 2
max_days_to_expiration: 45

# Option chain research is bounded to strikes within this fraction of the
# current underlying price (e.g. 0.08 = strikes from -8% to +8% of spot).
# Without a strike bound, get_option_chain returns whatever the API's
# default page happens to contain sorted by strike ascending, which (for a
# high-priced underlying like SPY) is deep out-of-the-money calls only, no
# puts at all - confirmed live. This keeps the research set relevant and
# small enough to reason about.
option_strike_band_pct: 0.08

# How many of the nearest-the-money option contracts per underlying get
# embedded in the decision prompt (bot/decide.py). Independent of, and
# smaller than, option_strike_band_pct's fetch window above — this keeps
# the prompt itself bounded regardless of how many contracts research
# fetched.
research_contracts_per_underlying: 12

# Challenger gets the research tools first (#43); promote to config.yaml
# once eod_review shows they help.
research_tools_enabled: true
research_max_tool_calls: 6

# Learning loop on for the challenger first (#31).
learning_enabled: true
learning_days: 2
learning_trades: 15

# Kalshi prior on for the challenger first (#44).
predictions_enabled: true
prediction_series:
  SPY: KXINX
  QQQ: KXNASDAQ100

# The strategy, in the model's own prompt (bot/decide.py appends this block
# verbatim). This is the highest-leverage end-of-day knob: change the
# thesis or its tactics here, no code change. Keep it short and factual -
# the hard limits above are enforced in code regardless of what this says.
strategy_notes: |
  THESIS: Buy defined-risk, short-dated options premium on the most liquid
  names when there is a concrete reason; code sizes, stops, and closes every
  trade before expiry.
  Tactics:
  - Prefer BUYING calls or puts with 2-14 days to expiration, at or slightly
    out of the money (|delta| roughly 0.35-0.55). Long premium only - max loss
    is the premium paid, which is the risk budget.
  - Trade the underlying's direction on evidence you can name: the day's
    price action versus the prior close, a clear intraday trend, unusually
    cheap or expensive implied volatility relative to the contract's peers.
    No reason, no trade - holding is the default.
  - One idea per underlying at a time; do not stack several strikes or
    expirations on the same name.
  - Positions are managed by code after entry: a stop-loss and take-profit on
    the premium, and a forced close on expiry day. An open position is
    presumed valid until a stop, a take-profit, or a NAMED change in the
    evidence cited at entry - to exit early, say which number moved and in
    which direction. DTE is not such a number: no expiry rule touches a
    position before the date shown on it, so expiry pressure is never a
    reason to exit early. Sell only the exact symbol listed under POSITIONS
    YOU HOLD.
  - Stock is allowed only as a small directional complement, never the main
    idea.

# Model - the Featherless model id and sampling for the decide call. Also
# runtime-overridable (see bot/overrides.py) for intraday A/B without a
# deploy; a change here in git is the durable version.
model: Qwen/Qwen3.8-Flash-Next  # challenger: 4x cheaper than Kimi, newest agentic model (Aug 2026)
# Qwen3.8 / Kimi-K2.6 are thinking models: without this they spend the whole
# max_tokens budget on hidden reasoning and return empty content (confirmed
# live 2026-08-29). GLM-5.3-Flash ignores this flag entirely - not usable here.
# Which model critiques the day in eod_review.py, in preference order. The
# first entry that is not the account's own `model` is used, recomputed at
# review time - so switching the trading model from the dashboard cannot
# silently make the reviewer the same model that traded. A model grading its
# own reasoning is the weakest form of review; this costs one call a day.
#
# Set `review_model` (config or a runtime override) to pin one explicitly and
# skip the list entirely.
review_model_preference:
  - moonshotai/Kimi-K2.6
  - moonshotai/Kimi-K2-Instruct
  - Qwen/Qwen3.8-Flash-Next

model_params:
  chat_template_kwargs:
    enable_thinking: false
temperature: 0.2
# 1500 since 2026-09-02, matching the official account (same dashboard
# session) - headroom against finish_reason=length, not extra spend.
max_tokens: 1500
request_timeout_sec: 60

# Per-token prices (USD per million) for the nightly cost line - this file
# never had the block (an oversight; mixed.yaml has it), so the test
# account's costs went unpriced. Same list as config.yaml.
model_prices:
  moonshotai/Kimi-K2-Instruct: {in: 0.6, out: 2.5}
  moonshotai/Kimi-K2.6: {in: 0.77, out: 3.5}
  Qwen/Qwen3.8-Flash-Next: {in: 0.15, out: 0.5}
  # K3 (#206): public per-M rates from llm-stats (via Fireworks) - the most
  # expensive option on the list by far; the dashboard select shows it, the
  # nightly cost line prices it.
  moonshotai/Kimi-K3: {in: 3.0, out: 15.0}

# Per-model exceptions to model_params, merged on top per top-level key at
# call time against the EFFECTIVE model (bot/config.py::model_params_for,
# #206). Kimi-K3 is the reason this exists: verified live on Featherless
# 2026-09-02, it REFUSES tool calls while thinking is disabled ("tool usage
# is currently disabled", in prose) but tool-calls correctly with its
# default thinking on - and unlike K2.6/Qwen its thinking is brief (a
# trivial prompt answered in 37 completion tokens), so leaving thinking on
# does not eat the budget the way the global toggle exists to prevent.
model_params_by_model:
  moonshotai/Kimi-K3:
    chat_template_kwargs:
      enable_thinking: true

# Transient model failures cost a whole cycle otherwise - the next attempt is
# the next cron slot, 10 minutes later (issue #85: 21% of early cycles lost a
# decision this way, split between upstream no_response and a 200 carrying an
# empty completion). Retries are bounded by BOTH a count and a wall clock, and
# the budget must stay far inside the 10-minute cadence so a retrying cycle can
# never overlap the next one. Auth/quota failures and truncated output are
# never retried - see bot/retry.py.
decide_max_attempts: 3
decide_retry_budget_sec: 120

# Deterministic exits (bot/exits.py), checked at the top of every cycle
# BEFORE the model is consulted. Percentages are of the entry premium (or
# entry price for stock): -40 means "close if the position has lost 40% of
# what was paid". Long premium's worst case is the premium, so the stop is
# about not sitting in a dead trade, the take-profit about banking gains
# that theta will otherwise erode.
stop_loss_pct: 40
take_profit_pct: 60
# Churn guard (#132): a model-proposed sell of a position opened under
# min_hold_minutes ago is refused unless its drawdown exceeds
# early_exit_drawdown_pct (headed for the stop anyway). Code exits
# (stop/take-profit/DTE) are never gated. Both runtime-overridable.
min_hold_minutes: 30
early_exit_drawdown_pct: 25

# Force-close any option contract with this many days to expiration or
# fewer, at any cycle - never carry a contract into expiration day's close.
# 0 = close on expiry day itself.
expiry_close_dte: 0

# End-of-day backstop (flatten.py --expiring-only, from cron): close option
# contracts expiring within this many days; hold everything else overnight
# under the stop/take-profit above. Judging is on Friday-9:30 equity, not
# daily P&L, so flatten-all every day is deliberately NOT the policy.
eod_close_dte: 1

# The final day of the event. The score is fixed at the PRIOR close (Alpaca
# measures equity as of EOD Thu Sep 3), so on/after this date run_cycle
# makes no new entries and flatten.py ignores --expiring-only and closes
# everything - post-snapshot cleanup so nothing is held over the weekend.
final_flatten_date: "2026-09-04"

# Trading window, US/Eastern. No new entries after last_entry; sells stay
# legal until trade_end. Cycle cadence is NOT set here - cron drives it
# (homenetwork: alpaca_hackathon_cycle_schedule, every 10 min inside market
# hours); run_cycle.py just gates itself on the window below.
trade_start: "09:45"
trade_end: "15:45"
last_entry: "15:15"

# MQTT side channel for Home Assistant (bot/mqtt.py, issue #14). Publish
# MQTT discovery, and the effective config is republished each cycle.
# Broker host/credentials come from the env (MQTT_HOST, MQTT_PORT,
# MQTT_USERNAME, MQTT_PASSWORD) - the same files that carry the API keys.
# No host, or broker down -> no-op. Inbound config/set is mqtt_bridge.py.
mqtt:
  enabled: true
  topic_prefix: alpaca-hackathon
  ha_discovery: true
  timeout_sec: 2
